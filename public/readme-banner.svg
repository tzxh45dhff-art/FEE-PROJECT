<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Huddle — one room, everything together</title>
  <desc id="desc">A dark, colourful graphic with floating cards representing watching, listening, playing and studying together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11121c"/><stop offset="1" stop-color="#1a1021"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff5368" stop-opacity=".3"/><stop offset="1" stop-color="#ff5368" stop-opacity="0"/></radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6d74"/><stop offset="1" stop-color="#e12f4b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8fff0"/><stop offset="1" stop-color="#4ec6bf"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe3a0"/><stop offset="1" stop-color="#f4a946"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1caff"/><stop offset="1" stop-color="#d273c5"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/><rect width="1400" height="420" rx="28" fill="url(#grid)"/><circle cx="1040" cy="205" r="310" fill="url(#glow)"/>
  <circle cx="82" cy="68" r="7" fill="#ff5a67"/><text x="103" y="74" fill="#d4d0da" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">YOUR PEOPLE. YOUR SPACE.</text>
  <text x="72" y="190" fill="#faf7f3" font-family="Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-7">huddle<tspan fill="#ff5967">.</tspan></text>
  <text x="78" y="249" fill="#e3dde1" font-family="Arial,sans-serif" font-size="31" font-weight="600">One room. Everything together.</text>
  <text x="80" y="291" fill="#a8a1af" font-family="Arial,sans-serif" font-size="20">Watch, listen, play and study with your people.</text>
  <rect x="80" y="330" width="176" height="35" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".13"/><circle cx="99" cy="348" r="4" fill="#80e9c5"/><text x="111" y="353" fill="#ddd9dc" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">MADE FOR FRIENDS</text>
  <g transform="translate(770 63) rotate(-6 125 70)"><rect width="250" height="138" rx="20" fill="#24222e" stroke="#ffffff" stroke-opacity=".14"/><rect x="16" y="16" width="218" height="84" rx="12" fill="url(#red)"/><path d="M111 37v40l36-20z" fill="#fff" fill-opacity=".95"/><text x="18" y="124" fill="#e9e0df" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">WATCH TOGETHER</text></g>
  <g transform="translate(1042 71) rotate(7 118 70)"><rect width="235" height="138" rx="20" fill="#24222e" stroke="#ffffff" stroke-opacity=".14"/><rect x="16" y="16" width="203" height="84" rx="12" fill="url(#cyan)"/><circle cx="117" cy="58" r="29" fill="#1b3336"/><circle cx="117" cy="58" r="17" fill="none" stroke="#e9fff8" stroke-opacity=".55"/><circle cx="117" cy="58" r="5" fill="#e9fff8"/><text x="18" y="124" fill="#e9e0df" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LISTEN IN SYNC</text></g>
  <g transform="translate(810 228) rotate(5 120 65)"><rect width="240" height="136" rx="20" fill="#24222e" stroke="#ffffff" stroke-opacity=".14"/><rect x="16" y="16" width="208" height="82" rx="12" fill="url(#gold)"/><path d="M94 42h53c13 0 23 12 23 26 0 10-8 13-15 7l-9-7h-51l-9 7c-7 6-15 3-15-7 0-14 10-26 23-26z" fill="#61402b"/><path d="M100 50v15m-7-7h15" stroke="#ffe7b1" stroke-width="4" stroke-linecap="round"/><circle cx="140" cy="54" r="3" fill="#ffe7b1"/><circle cx="150" cy="62" r="3" fill="#ffe7b1"/><text x="18" y="122" fill="#e9e0df" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">PLAY A ROUND</text></g>
  <g transform="translate(1081 224) rotate(-5 110 65)"><rect width="220" height="136" rx="20" fill="#24222e" stroke="#ffffff" stroke-opacity=".14"/><rect x="16" y="16" width="188" height="82" rx="12" fill="url(#pink)"/><path d="M76 37c11-4 25-2 34 4 9-6 23-8 34-4v36c-11-4-25-2-34 4-9-6-23-8-34-4z" fill="none" stroke="#633d60" stroke-width="5" stroke-linejoin="round"/><path d="M110 42v33" stroke="#633d60" stroke-width="4"/><text x="18" y="122" fill="#e9e0df" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">STUDY SIDE BY SIDE</text></g>
</svg>
