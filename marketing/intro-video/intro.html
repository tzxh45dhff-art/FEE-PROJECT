<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Huddle — intro</title>
<!--
  Huddle's introductory film, as a pure function of time.

  Nothing here animates by itself. There are no CSS transitions, no
  keyframes, no requestAnimationFrame loop: `render(t)` sets every property
  from the timestamp alone, and the renderer calls it once per frame. That is
  what makes the output perfectly smooth — a frame cannot be dropped, late, or
  out of step with its neighbours, because no frame depends on how long the
  previous one took.

  Brand is the app's own: Archivo for display, Inter for text, chalk on void,
  the red signal colour, and the huddle mark. The lines are the landing page's.

  Preview a single moment with ?t=12.3, or ?play to watch it in real time.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=Inter:opsz,wght@14..32,300..700&display=block"
  rel="stylesheet"
/>
<style>
  :root {
    --void: #050505;
    --chalk: #fafafa;
    --mist: #a4a4ab;
    --dusk: #6e6e77;
    --line: #2a2a2e;
    --surface: #121214;
    --elev: #1b1b1e;
    --red: #ff1f3d;
    --red-bright: #ff5a5a;
    --blue: #2b3bff;
    --violet: #a01aff;
    --teal: #00c2b8;
    --amber: #ffb547;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--void); }
  body {
    font-family: Inter, system-ui, sans-serif;
    color: var(--chalk);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--void); }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .scene { position: absolute; inset: 0; }

  /* ── ambient light ─────────────────────────────────────────────────── */
  .glow {
    position: absolute; width: 1600px; height: 1600px; left: 0; top: 0;
    border-radius: 50%; pointer-events: none; will-change: transform, opacity;
  }
  #glowA { background: radial-gradient(circle, rgba(255,31,61,.34) 0%, rgba(255,31,61,.10) 32%, rgba(255,31,61,0) 62%); }
  #glowB { background: radial-gradient(circle, rgba(43,59,255,.30) 0%, rgba(43,59,255,.09) 34%, rgba(43,59,255,0) 64%); }
  #glowC { background: radial-gradient(circle, rgba(160,26,255,.22) 0%, rgba(160,26,255,.06) 34%, rgba(160,26,255,0) 64%); }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 46%, rgba(0,0,0,.62) 100%);
  }
  /* Sized explicitly and never scaled. It was scaled about its own centre,
     which left the right quarter of the frame uncovered — a visible seam,
     since the grain lightens what it covers. */
  #grain { position: absolute; left: -40px; top: -40px; width: 2000px; height: 1126px;
           pointer-events: none; opacity: .055; mix-blend-mode: screen; image-rendering: auto; }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }

  /* ── type ───────────────────────────────────────────────────────────── */
  .display {
    font-family: Archivo, 'Helvetica Neue', sans-serif;
    font-weight: 620; font-stretch: 96%;
    letter-spacing: -0.035em; line-height: 0.98; color: var(--chalk);
  }
  .line { display: block; overflow: hidden; padding: 0.04em 0 0.12em; margin-bottom: -0.1em; }
  .w { display: inline-block; will-change: transform; }
  .eyebrow {
    font: 600 18px/1 Inter, sans-serif; letter-spacing: .22em; text-transform: uppercase;
    color: var(--red-bright); display: flex; align-items: center; gap: 14px;
  }
  .eyebrow i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); display: block;
               box-shadow: 0 0 18px 2px rgba(255,31,61,.8); }
  .body { font: 400 26px/1.45 Inter, sans-serif; color: var(--mist); letter-spacing: -0.005em; }
  .mono { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }

  /* ── surfaces ───────────────────────────────────────────────────────── */
  .card {
    background: linear-gradient(180deg, rgba(28,28,31,.92), rgba(18,18,20,.92));
    border: 1px solid rgba(255,255,255,.08); border-radius: 22px;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    font: 500 19px/1 Inter, sans-serif; color: var(--chalk);
  }
  .chip b { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .avatar {
    border-radius: 50%; display: grid; place-items: center; color: #fff;
    font: 650 20px/1 Inter, sans-serif; flex: none;
  }

  /* ── poster, used on both screens in Watch ─────────────────────────── */
  .poster { position: absolute; inset: 0; overflow: hidden; background: #08061a; }
  .poster .sky { position: absolute; inset: 0;
    background: linear-gradient(180deg, #0b0630 0%, #2a0b4a 38%, #8a1a4f 62%, #ff5a3d 78%, #ffb547 100%); }
  .poster .sun { position: absolute; left: 50%; top: 52%; width: 46%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%,-50%);
    background: linear-gradient(180deg, #ffe08a 0%, #ff8a3d 55%, #ff2d6f 100%);
    -webkit-mask: repeating-linear-gradient(180deg, #000 0 9%, transparent 9% 11%);
    box-shadow: 0 0 120px 30px rgba(255,90,60,.35); }
  .poster .hills { position: absolute; left: -5%; right: -5%; bottom: 0; height: 42%;
    background: #0a0418; clip-path: polygon(0 55%, 12% 30%, 24% 52%, 38% 22%, 52% 48%, 64% 26%, 78% 50%, 90% 28%, 100% 46%, 100% 100%, 0 100%); }
  .poster .hills2 { position: absolute; left: -5%; right: -5%; bottom: 0; height: 26%;
    background: #040109; clip-path: polygon(0 40%, 18% 60%, 32% 34%, 50% 62%, 66% 38%, 82% 58%, 100% 36%, 100% 100%, 0 100%); }
  .poster .grade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.65)); }
  .bar { position: absolute; left: 6%; right: 6%; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--red); }
  .bar .head { position: absolute; top: 50%; width: 15px; height: 15px; border-radius: 50%; background: #fff;
    transform: translate(-50%,-50%); box-shadow: 0 0 0 4px rgba(255,31,61,.35); }
  .pauseIcon { position: absolute; left: 50%; top: 50%; display: flex; gap: 14%; width: 16%; aspect-ratio: 1;
    align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.2); }
  .pauseIcon span { width: 13%; height: 40%; background: #fff; border-radius: 3px; display: block; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="glowA"></div>
  <div class="glow" id="glowB"></div>
  <div class="glow" id="glowC"></div>

  <div id="cam">

    <!-- 1 · the mark ──────────────────────────────────────────────────── -->
    <div class="scene" id="s1">
      <div id="s1trails"></div>
      <div id="s1pulse" class="abs" style="width:400px;height:400px;border-radius:50%;border:2px solid var(--red);"></div>
      <div id="s1mark" class="abs" style="width:190px;height:190px;"></div>
      <div id="s1word" class="abs display" style="font-size:170px;font-weight:650;letter-spacing:-0.045em;white-space:nowrap;"></div>
    </div>

    <!-- 2 · everyone on the same second ───────────────────────────────── -->
    <div class="scene" id="s2">
      <div id="s2h" class="abs display" style="font-size:150px;width:1920px;text-align:center;"></div>
      <div id="s2tracks" class="abs" style="width:1180px;height:300px;"></div>
      <div id="s2sync" class="abs" style="width:3px;height:300px;border-radius:2px;background:var(--red);box-shadow:0 0 30px 6px rgba(255,31,61,.55);"></div>
      <div id="s2sub" class="abs body" style="width:1920px;text-align:center;font-size:30px;"></div>
    </div>

    <!-- 3 · watch ─────────────────────────────────────────────────────── -->
    <div class="scene" id="s3">
      <div id="s3eye" class="abs eyebrow"><i></i>Watch</div>
      <div id="s3h" class="abs display" style="font-size:112px;width:820px;"></div>
      <div id="s3chips" class="abs" style="display:flex;gap:14px;width:820px;flex-wrap:wrap;"></div>
      <div id="s3laptop" class="abs"></div>
      <div id="s3phone" class="abs"></div>
      <svg id="s3arc" class="abs" width="1920" height="1080" style="overflow:visible"></svg>
      <div id="s3note" class="abs" style="font:500 20px/1 Inter;color:var(--chalk);display:flex;align-items:center;gap:10px;"></div>
      <svg id="s3cursor" class="abs" width="34" height="42" viewBox="0 0 34 42"><path d="M3 2 L3 33 L11 25 L17 39 L23 36 L17 23 L28 23 Z" fill="#fff" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div id="s3ripple" class="abs" style="width:80px;height:80px;border-radius:50%;border:2px solid #fff;"></div>
    </div>

    <!-- 4 · listen ────────────────────────────────────────────────────── -->
    <div class="scene" id="s4">
      <div id="s4eye" class="abs eyebrow"><i></i>Listen</div>
      <div id="s4h" class="abs display" style="font-size:112px;width:860px;"></div>
      <div id="s4now" class="abs card" style="width:760px;height:300px;"></div>
      <div id="s4queue" class="abs" style="width:760px;height:340px;"></div>
    </div>

    <!-- 5 · play ──────────────────────────────────────────────────────── -->
    <div class="scene" id="s5">
      <div id="s5eye" class="abs eyebrow"><i></i>Play</div>
      <div id="s5h" class="abs display" style="font-size:112px;width:860px;"></div>
      <svg id="s5board" class="abs" width="440" height="440" viewBox="0 0 440 440" style="overflow:visible"></svg>
      <div id="s5board-bg" class="abs card" style="width:500px;height:500px;z-index:-1"></div>
      <div id="s5lead" class="abs card" style="width:360px;height:300px;padding:30px;"></div>
    </div>

    <!-- 6 · study ─────────────────────────────────────────────────────── -->
    <div class="scene" id="s6">
      <div id="s6eye" class="abs eyebrow"><i></i>Study</div>
      <div id="s6h" class="abs display" style="font-size:108px;width:860px;"></div>
      <div id="s6timer" class="abs card" style="width:330px;height:330px;"></div>
      <div id="s6doc" class="abs card" style="width:420px;height:150px;"></div>
      <div id="s6notes" class="abs card" style="width:500px;height:300px;"></div>
      <div id="s6code" class="abs card" style="width:520px;height:300px;"></div>
    </div>

    <!-- 7 · together ──────────────────────────────────────────────────── -->
    <div class="scene" id="s7">
      <div id="s7h" class="abs display" style="font-size:104px;width:1920px;text-align:center;"></div>
      <div id="s7tiles" class="abs" style="width:1500px;height:260px;"></div>
      <div id="s7chat" class="abs" style="width:1500px;height:200px;"></div>
    </div>

    <!-- 8 · close ─────────────────────────────────────────────────────── -->
    <div class="scene" id="s8">
      <div id="s8steps" class="abs" style="width:1500px;height:260px;"></div>
      <div id="s8mark" class="abs" style="width:150px;height:150px;"></div>
      <div id="s8word" class="abs display" style="font-size:150px;font-weight:650;letter-spacing:-0.045em;white-space:nowrap;"></div>
      <div id="s8tag" class="abs display" style="font-size:52px;width:1920px;text-align:center;color:var(--mist);font-weight:520;letter-spacing:-0.02em;"></div>
      <div id="s8url" class="abs" style="width:1920px;text-align:center;font:500 24px/1 Inter;letter-spacing:.06em;color:var(--dusk);"></div>
    </div>
  </div>

  <div id="vignette"></div>
  <canvas id="grain" width="1024" height="576"></canvas>
  <div id="fade"></div>
</div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   Time, easing, and the handful of helpers everything else is built from.
   ═════════════════════════════════════════════════════════════════════════ */

const DURATION = 42
const FPS = 60
const W = 1920, H = 1080, CX = W / 2, CY = H / 2

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, p) => a + (b - a) * p
/** 0→1 as t crosses [a, b]. */
const P = (t, a, b) => clamp((t - a) / (b - a))
const E = {
  linear: (p) => p,
  outExpo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inExpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
  outQuint: (p) => 1 - Math.pow(1 - p, 5),
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  inOutQuint: (p) => (p < 0.5 ? 16 * p ** 5 : 1 - Math.pow(-2 * p + 2, 5) / 2),
  inOutSine: (p) => -(Math.cos(Math.PI * p) - 1) / 2,
  outBack: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2 },
}
/** Eased progress in one call. */
const ep = (t, a, b, f = E.outExpo) => f(P(t, a, b))

const $ = (id) => document.getElementById(id)
function el(tag, style = '', html = '') {
  const n = document.createElement(tag)
  if (style) n.style.cssText = style
  if (html) n.innerHTML = html
  return n
}
/** Transform, opacity and blur in one place, so nothing sets half a state. */
function put(node, o) {
  let tr = ''
  if (o.x !== undefined || o.y !== undefined) tr += `translate3d(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px,0) `
  if (o.s !== undefined) tr += `scale(${o.s.toFixed(4)}) `
  if (o.sx !== undefined) tr += `scale(${o.sx.toFixed(4)},${(o.sy ?? 1).toFixed(4)}) `
  if (o.r !== undefined) tr += `rotate(${o.r.toFixed(3)}deg) `
  node.style.transform = tr
  if (o.o !== undefined) node.style.opacity = clamp(o.o).toFixed(4)
  if (o.b !== undefined) node.style.filter = o.b > 0.05 ? `blur(${o.b.toFixed(2)}px)` : 'none'
}
/** A scene costs nothing while it is off screen. */
function show(node, t, a, b) {
  const on = t >= a && t <= b
  node.style.display = on ? '' : 'none'
  return on
}

/* Headlines are built as lines of masked words, so each word can rise into
   its own line rather than the block fading in as one. */
function title(node, lines, extraClass = '') {
  node.innerHTML = lines
    .map((line) => `<span class="line ${extraClass}">${line.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ')}</span>`)
    .join('')
}
/** Rise in word by word; leave upward. Blur rides along with the motion. */
function words(node, t, tin, tout, stagger = 0.055, dur = 1.05) {
  const ws = node.querySelectorAll('.w')
  ws.forEach((w, i) => {
    const pin = E.outExpo(P(t, tin + i * stagger, tin + i * stagger + dur))
    const pout = E.inOutCubic(P(t, tout + i * stagger * 0.45, tout + i * stagger * 0.45 + 0.62))
    const y = (1 - pin) * 112 - pout * 112
    w.style.transform = `translate3d(0,${y.toFixed(2)}%,0) rotate(${((1 - pin) * 4).toFixed(2)}deg)`
    w.style.opacity = (Math.min(1, pin * 1.4) * (1 - pout)).toFixed(3)
  })
}
/** Shared enter/exit for supporting elements: drift up into place, lift away. */
function enterExit(node, t, tin, tout, { dy = 60, dx = 0, s0 = 1, dur = 1.1, outDur = 0.6, base = {} } = {}) {
  const pin = ep(t, tin, tin + dur)
  const pout = ep(t, tout, tout + outDur, E.inOutCubic)
  put(node, {
    x: (base.x || 0) + (1 - pin) * dx - pout * dx * 0.5,
    y: (base.y || 0) + (1 - pin) * dy - pout * 50,
    s: lerp(s0, 1, pin) * (base.s || 1),
    o: pin * (1 - pout),
    b: (1 - pin) * 12 + pout * 10,
  })
  return { pin, pout }
}

/* ═════════════════════════════════════════════════════════════════════════
   The huddle mark — the app's own favicon, inline.
   ═════════════════════════════════════════════════════════════════════════ */
function markSVG(id) {
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible">
    <defs><mask id="${id}">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="38" cy="32" r="8" fill="#000"/>
      <circle cx="62" cy="32" r="8" fill="#000"/>
      <rect x="38" y="28" width="24" height="8" rx="4" fill="#000"/>
      <path fill="#000" d="M20 92V62c0-15 13-24 30-24s30 9 30 24v30h-7c0-14-2-22-5-28-3-7-9-11-18-11s-15 4-18 11c-3 6-5 14-5 28Z"/>
      <path fill="#000" d="M10 92V72a20 20 0 0 1 20 20Z"/>
      <path fill="#000" d="M90 92V72a20 20 0 0 0-20 20Z"/>
    </mask>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a1e"/><stop offset="1" stop-color="#0b0b0d"/></linearGradient></defs>
    <rect width="100" height="100" rx="24" fill="url(#${id}g)" stroke="rgba(255,255,255,.14)" stroke-width="0.8"/>
    <path mask="url(#${id})" fill="#fafafa" d="M10 92V46c0-19 13-32 29-32 6 0 9 4 11 9 2-5 5-9 11-9 16 0 29 13 29 32v46Z"/>
  </svg>`
}

/* ═════════════════════════════════════════════════════════════════════════
   Build — every node the film uses, created once.
   ═════════════════════════════════════════════════════════════════════════ */

const PEOPLE = [
  { n: 'Aditi', c: '#ff1f3d' },
  { n: 'Rohan', c: '#2b3bff' },
  { n: 'Meera', c: '#a01aff' },
  { n: 'You', c: '#00c2b8' },
  { n: 'Kabir', c: '#ffb547' },
]

// 1 · mark
const s1dots = []
for (let i = 0; i < 5; i++) {
  const ghosts = []
  for (let k = 0; k < 9; k++) {
    const g = el('div', `position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:${i === 0 ? 'var(--red)' : 'var(--chalk)'};`)
    $('s1trails').appendChild(g)
    ghosts.push(g)
  }
  s1dots.push(ghosts)
}
$('s1mark').innerHTML = markSVG('m1')
$('s1word').innerHTML = 'Huddle'.split('').map((c) => `<span class="w" style="display:inline-block">${c}</span>`).join('')

// 2 · same second
title($('s2h'), ['Everyone on the', 'same second.'])
const s2rows = PEOPLE.map((p, i) => {
  const row = el('div', `position:absolute;left:0;top:${i * 60}px;width:1180px;height:40px;`)
  const track = el('div', 'position:absolute;left:0;right:0;top:19px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);')
  const fill = el('div', `position:absolute;left:0;top:19px;height:2px;border-radius:2px;background:linear-gradient(90deg, rgba(255,255,255,0), ${p.c});`)
  const head = el('div', `position:absolute;top:0;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:${p.c};display:grid;place-items:center;font:650 16px/1 Inter;color:#fff;box-shadow:0 0 24px 2px ${p.c}66;`, p.n[0])
  row.append(track, fill, head)
  $('s2tracks').appendChild(row)
  return { row, fill, head }
})
$('s2sub').textContent = 'Watch, listen, play and study — together, in one room.'

// 3 · watch
title($('s3h'), ['Pause it here,', 'it stops there.'])
;['YouTube', 'Your uploads', 'Netflix', 'Prime Video'].forEach((label, i) => {
  const dots = ['#ff1f3d', '#a4a4ab', '#e50914', '#00a8e1']
  $('s3chips').appendChild(el('div', '', `<span class="chip"><b style="background:${dots[i]}"></b>${label}</span>`))
})
function poster() {
  return `<div class="poster"><div class="pz" style="position:absolute;inset:0;transform-origin:50% 60%">
    <div class="sky"></div><div class="sun"></div><div class="hills"></div><div class="hills2"></div></div><div class="grade"></div></div>`
}
function screen(w, h, radius, bezel) {
  return `<div style="position:absolute;inset:0;border-radius:${radius}px;background:#0c0c0e;border:1px solid rgba(255,255,255,.12);
      box-shadow:0 60px 120px -40px rgba(0,0,0,.9), 0 0 0 ${bezel}px #161618, 0 0 0 ${bezel + 1}px rgba(255,255,255,.08);overflow:hidden">
      ${poster()}
      <div class="bar" style="bottom:${Math.round(h * 0.07)}px"><div class="fill"></div><div class="head"></div></div>
      <div class="pauseIcon" style="transform:translate(-50%,-50%)"><span></span><span></span></div>
    </div>`
}
$('s3laptop').style.cssText += 'width:780px;height:440px;'
$('s3laptop').innerHTML = screen(780, 440, 14, 12)
$('s3phone').style.cssText += 'width:230px;height:470px;'
$('s3phone').innerHTML = screen(230, 470, 34, 9)
$('s3note').innerHTML = '<span style="width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 14px 2px rgba(255,31,61,.8)"></span>Paused for everyone'

// 4 · listen
title($('s4h'), ['A queue with', "everyone's", 'fingerprints on it.'])
$('s4now').innerHTML = `

/* ═════════════════════════════════════════════════════════════════════════
   Grain — film noise, which also dithers the gradients so the encode does
   not band them into stripes. Four tiles generated once, cycled per frame.
   ═════════════════════════════════════════════════════════════════════════ */
const grainCanvas = $('grain'), gctx = grainCanvas.getContext('2d')
const grainTiles = []
{
  let seed = 7
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296)
  for (let k = 0; k < 4; k++) {
    const img = gctx.createImageData(1024, 576)
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.floor(rnd() * 255)
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v
      img.data[i + 3] = 255
    }
    grainTiles.push(img)
  }
}

/* ═════════════════════════════════════════════════════════════════════════
   Render — the whole film, as a function of t.
   ═════════════════════════════════════════════════════════════════════════ */

function render(t) {
  const frame = Math.round(t * FPS)

  /* Grain, swapped every other frame: changing on every one reads as fizz. */
  gctx.putImageData(grainTiles[Math.floor(frame / 2) % 4], 0, 0)
  $('grain').style.transform = `translate3d(${(frame * 37) % 30}px, ${(frame * 53) % 30}px, 0)`

  /* A camera that never quite stops — the difference between motion graphics
     and slides is that nothing is ever fully at rest. */
  put($('cam'), {
    x: Math.sin(t * 0.23) * 10,
    y: Math.cos(t * 0.19) * 7,
    s: 1.012 + Math.sin(t * 0.31) * 0.008,
  })

  /* Ambient light: drifts continuously, and leans toward each scene's colour. */
  const mood = [
    [0, 0.55, 0.2, 0.1], [4.5, 0.85, 0.55, 0.15], [9.5, 0.9, 0.45, 0.4],
    [15, 0.75, 0.3, 0.75], [20.3, 0.55, 0.9, 0.3], [24.8, 0.4, 0.7, 0.2],
    [30.6, 0.8, 0.6, 0.55], [35, 0.95, 0.35, 0.2], [42, 0.7, 0.2, 0.1],
  ]
  let A = mood[0], B = mood[0]
  for (let i = 0; i < mood.length - 1; i++) if (t >= mood[i][0] && t <= mood[i + 1][0]) { A = mood[i]; B = mood[i + 1] }
  const mp = E.inOutSine(P(t, A[0], B[0]))
  const ga = lerp(A[1], B[1], mp), gb = lerp(A[2], B[2], mp), gc = lerp(A[3], B[3], mp)
  put($('glowA'), { x: 220 + Math.sin(t * 0.21) * 260 - 800, y: 260 + Math.cos(t * 0.17) * 160 - 800, s: 1 + Math.sin(t * 0.13) * 0.12, o: ga })
  put($('glowB'), { x: 1640 + Math.cos(t * 0.18) * 240 - 800, y: 820 + Math.sin(t * 0.23) * 180 - 800, s: 1 + Math.cos(t * 0.11) * 0.12, o: gb })
  put($('glowC'), { x: 1100 + Math.sin(t * 0.15 + 2) * 420 - 800, y: 120 + Math.cos(t * 0.2) * 200 - 800, s: 0.9, o: gc })

  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t); scene7(t); scene8(t)

  /* Fade from and to black. */
  $('fade').style.opacity = Math.max(1 - ep(t, 0, 0.7, E.outCubic), ep(t, DURATION - 0.9, DURATION - 0.05, E.inOutCubic)).toFixed(3)
}

/* ── 1 · a dot, a crowd, a mark ────────────────────────────────────────── */
function dotPos(i, t) {
  /* Where dot i is at time t — sampled at earlier times too, for the trails. */
  const spread = ep(t, 0.75, 1.75, E.outExpo) * (1 - ep(t, 1.85, 2.65, E.inOutQuint))
  const radius = 210 * spread
  const spin = t * 1.7 - E.outExpo(P(t, 0.75, 2.7)) * 1.2
  const a = -Math.PI / 2 + i * ((Math.PI * 2) / 5) + spin
  /* A little breathing in the orbit keeps it from looking mechanical. */
  const r = radius * (1 + Math.sin(t * 3 + i * 1.3) * 0.05)
  return [CX + Math.cos(a) * r, CY + Math.sin(a) * r]
}
function scene1(t) {
  if (!show($('s1'), t, 0, 4.7)) return
  const seed = ep(t, 0.15, 0.85, E.outBack)
  const converge = ep(t, 1.85, 2.65, E.inOutQuint)
  const markIn = ep(t, 2.35, 3.25, E.outBack)
  const exit = ep(t, 3.85, 4.6, E.inOutCubic)

  s1dots.forEach((ghosts, i) => {
    ghosts.forEach((g, k) => {
      const tt = t - k * 0.022
      const [x, y] = dotPos(i, tt)
      /* Before the split there is only one dot; the others hide inside it. */
      const visible = i === 0 ? 1 : ep(t, 0.72, 0.8, E.linear)
      const size = (k === 0 ? 1 : 1 - k / 10) * seed * (1 - converge * 0.6)
      put(g, {
        x: x - 11, y: y - 11, s: size,
        o: visible * (k === 0 ? 1 : 0.32 * (1 - k / 9)) * (1 - ep(t, 2.45, 2.75, E.linear)),
      })
    })
  })

  /* A pulse as the crowd becomes the mark. */
  const pulse = P(t, 2.5, 3.6)
  put($('s1pulse'), { x: CX - 200, y: CY - 200, s: 0.25 + E.outExpo(pulse) * 1.6, o: (1 - E.outCubic(pulse)) * (pulse > 0 ? 0.9 : 0) })

  /* Centre the finished lockup, not the mark: measure the word, then slide
     the mark from dead centre to wherever the pair is centred together. */
  const shift = ep(t, 3.0, 3.85, E.inOutQuint)
  const word = $('s1word')
  const MARK = 190, GAP = 34
  const startX = CX - (MARK + GAP + word.offsetWidth) / 2
  put($('s1mark'), {
    x: lerp(CX - MARK / 2, startX, shift), y: CY - 95 - exit * 40,
    s: (0.3 + markIn * 0.7) * (1 - exit * 0.12),
    o: Math.min(1, markIn * 1.6) * (1 - exit),
    r: (1 - markIn) * -12,
    b: exit * 8,
  })
  put(word, { x: startX + MARK + GAP, y: CY - 98 - exit * 40, o: 1 - exit, b: exit * 8 })
  word.querySelectorAll('.w').forEach((c, i) => {
    const p = ep(t, 3.05 + i * 0.05, 3.95 + i * 0.05, E.outExpo)
    c.style.transform = `translate3d(${((1 - p) * -40).toFixed(2)}px,0,0)`
    c.style.opacity = p.toFixed(3)
    c.style.filter = p < 0.98 ? `blur(${((1 - p) * 10).toFixed(2)}px)` : 'none'
  })
}

/* ── 2 · everyone on the same second ───────────────────────────────────── */
const S2_OFF = [0.18, 0.66, 0.37, 0.84, 0.5]
function scene2(t) {
  if (!show($('s2'), t, 4.0, 9.9)) return
  words($('s2h'), t, 4.35, 9.0, 0.07, 1.1)
  put($('s2h'), { x: 0, y: 165 })

  const tracks = $('s2tracks')
  const tin = ep(t, 4.7, 5.9), tout = ep(t, 9.05, 9.75, E.inOutCubic)
  put(tracks, { x: CX - 590, y: 560 + (1 - tin) * 50 + tout * 30, o: tin * (1 - tout) })

  const align = ep(t, 6.2, 7.5, E.inOutQuint)
  const common = 0.42 + (t - 7) * 0.03
  s2rows.forEach((r, i) => {
    const own = S2_OFF[i] + (t - 4) * (0.022 + i * 0.006) + Math.sin(t * 1.6 + i * 2) * 0.012
    const pos = clamp(lerp(own, common, align), 0.02, 0.98)
    r.head.style.left = (pos * 1180).toFixed(2) + 'px'
    r.fill.style.width = (pos * 1180).toFixed(2) + 'px'
    const rin = ep(t, 4.85 + i * 0.08, 5.9 + i * 0.08)
    put(r.row, { x: (1 - rin) * -60, o: rin })
    /* Each head bumps as the line locks through it. */
    const bump = P(t, 7.3 + i * 0.03, 7.9 + i * 0.03)
    r.head.style.transform = `scale(${(1 + Math.sin(bump * Math.PI) * 0.28).toFixed(3)})`
  })

  /* The sync line arrives the moment everyone is on it. */
  const lock = ep(t, 7.15, 7.8, E.outExpo)
  const lx = CX - 590 + common * 1180
  put($('s2sync'), { x: lx - 1.5, y: 548 + tout * 30, sy: lock, sx: 1, o: lock * (1 - tout) })
  $('s2sync').style.transformOrigin = '50% 50%'

  enterExit($('s2sub'), t, 7.75, 9.0, { dy: 30, base: { y: 900 } })
}

/* ── 3 · watch ─────────────────────────────────────────────────────────── */
const PAUSE_AT = 12.25, RESUME_AT = 13.55
function filmTime(t) {
  /* The film's own clock, which stops while it is paused — for everyone. */
  if (t < PAUSE_AT) return t
  if (t < RESUME_AT) return PAUSE_AT
  return t - (RESUME_AT - PAUSE_AT)
}
function scene3(t) {
  if (!show($('s3'), t, 9.3, 15.6)) return
  const L = 150
  const eye = enterExit($('s3eye'), t, 9.55, 14.75, { dy: 20, base: { x: L, y: 310 } })
  words($('s3h'), t, 9.7, 14.75)
  put($('s3h'), { x: L, y: 350 })
  $('s3chips').querySelectorAll('.chip').forEach((c, i) => {
    const p = ep(t, 10.9 + i * 0.09, 11.8 + i * 0.09, E.outBack)
    const o = ep(t, 14.7 + i * 0.04, 15.2 + i * 0.04, E.inOutCubic)
    put(c, { y: (1 - p) * 30 - o * 30, s: 0.85 + p * 0.15, o: Math.min(1, p) * (1 - o) })
  })
  put($('s3chips'), { x: L, y: 640 })

  const ft = filmTime(t)
  const prog = (0.18 + (ft - 9.3) * 0.028)
  const lapIn = ep(t, 9.75, 11.0), phIn = ep(t, 10.05, 11.3)
  const devOut = ep(t, 14.8, 15.55, E.inOutCubic)
  const lx = 1030, ly = 250
  put($('s3laptop'), { x: lx + (1 - lapIn) * 140 - devOut * 120, y: ly + Math.sin(t * 0.9) * 4, s: 0.94 + lapIn * 0.06, o: lapIn * (1 - devOut), b: (1 - lapIn) * 10 + devOut * 8 })
  put($('s3phone'), { x: 1610 + (1 - phIn) * 160 - devOut * 160, y: 460 + Math.cos(t * 0.8) * 6, r: (1 - phIn) * 8 + Math.sin(t * 0.6) * 0.6, o: phIn * (1 - devOut), b: (1 - phIn) * 10 + devOut * 8 })

  /* Both screens, one film: the same position, the same pause. */
  const paused = t >= PAUSE_AT && t < RESUME_AT
  const pIcon = ep(t, PAUSE_AT, PAUSE_AT + 0.35, E.outBack) * (1 - ep(t, RESUME_AT, RESUME_AT + 0.3, E.inOutCubic))
  for (const id of ['s3laptop', 's3phone']) {
    const root = $(id)
    root.querySelector('.pz').style.transform = `scale(${(1.06 + ft * 0.004).toFixed(4)}) translateY(${(-Math.sin(ft * 0.25) * 6).toFixed(2)}px)`
    root.querySelector('.fill').style.width = (clamp(prog) * 100).toFixed(3) + '%'
    root.querySelector('.head').style.left = (clamp(prog) * 100).toFixed(3) + '%'
    const pi = root.querySelector('.pauseIcon')
    pi.style.opacity = clamp(pIcon * 1.1).toFixed(3)
    pi.style.transform = `translate(-50%,-50%) scale(${(0.7 + pIcon * 0.3).toFixed(3)})`
    /* Paused frames dim a touch, the way a real player does. */
    root.querySelector('.poster').style.filter = `brightness(${(1 - pIcon * 0.25).toFixed(3)})`
  }

  /* The cursor: across to the pause button, click, wait, click again. */
  /* Clicking the picture is how you pause a player — the cursor goes to the
     middle of the frame, where the pause icon then appears under it. */
  const btnX = lx + 330, btnY = ly + 250
  const c1 = ep(t, 11.3, 12.15, E.inOutCubic)
  const c2 = ep(t, 13.0, 13.45, E.inOutCubic)
  const cx = lerp(lerp(1520, btnX, c1), btnX + 6, c2)
  const cy = lerp(lerp(860, btnY, c1), btnY + 4, c2)
  const click = (t0) => Math.sin(clamp((t - t0) / 0.18) * Math.PI)
  const press = Math.max(click(PAUSE_AT - 0.06), click(RESUME_AT - 0.06))
  const cIn = ep(t, 11.2, 11.6), cOut = ep(t, 13.9, 14.3, E.inOutCubic)
  put($('s3cursor'), { x: cx, y: cy, s: 1 - press * 0.16, o: cIn * (1 - cOut) })
  const rp = Math.max(P(t, PAUSE_AT, PAUSE_AT + 0.55) * (t < PAUSE_AT + 0.55 ? 1 : 0), P(t, RESUME_AT, RESUME_AT + 0.55) * (t >= RESUME_AT && t < RESUME_AT + 0.55 ? 1 : 0))
  put($('s3ripple'), { x: btnX - 40 + 4, y: btnY - 40 + 6, s: 0.2 + E.outExpo(rp) * 1.4, o: rp > 0 ? (1 - E.outCubic(rp)) * 0.9 : 0 })

  /* The pause travels: a pulse along an arc from one screen to the other. */
  const arc = $('s3arc')
  if (!arc.firstChild) {
    arc.innerHTML = `<path id="arcPath" d="M ${lx + 390} ${ly + 220} C ${lx + 520} ${ly - 120}, ${1610 + 260} ${ly - 60}, ${1610 + 115} ${460 + 235}"
      stroke="url(#ag)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <defs><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="#ff1f3d" stop-opacity="0"/><stop offset=".5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/></linearGradient></defs>
      <circle id="arcDot" r="9" fill="#ff5a5a" style="filter:drop-shadow(0 0 12px #ff1f3d)"/>`
  }
  const path = $('arcPath'), len = path.getTotalLength()
  const travel = ep(t, PAUSE_AT + 0.02, PAUSE_AT + 0.42, E.inOutCubic)
  const arcVis = (t >= PAUSE_AT && t < PAUSE_AT + 0.9) ? 1 - ep(t, PAUSE_AT + 0.45, PAUSE_AT + 0.9, E.inOutCubic) : 0
  path.style.strokeDasharray = `${len}`
  path.style.strokeDashoffset = `${(len * (1 - travel)).toFixed(1)}`
  path.style.opacity = arcVis.toFixed(3)
  const pt = path.getPointAtLength(len * travel)
  const dot = $('arcDot')
  dot.setAttribute('cx', pt.x.toFixed(1)); dot.setAttribute('cy', pt.y.toFixed(1))
  dot.style.opacity = (arcVis * (travel < 1 ? 1 : 0.0)).toFixed(3)

  const note = ep(t, PAUSE_AT + 0.35, PAUSE_AT + 0.9) * (1 - ep(t, RESUME_AT - 0.1, RESUME_AT + 0.3, E.inOutCubic))
  put($('s3note'), { x: 1585, y: 960 + (1 - note) * 14, o: note })
}

/* ── 4 · listen ────────────────────────────────────────────────────────── */
function scene4(t) {
  if (!show($('s4'), t, 14.8, 20.9)) return
  const L = 150
  enterExit($('s4eye'), t, 15.05, 20.0, { dy: 20, base: { x: L, y: 330 } })
  words($('s4h'), t, 15.2, 20.0)
  put($('s4h'), { x: L, y: 370 })

  const out = ep(t, 20.05, 20.8, E.inOutCubic)
  const nowIn = ep(t, 15.35, 16.6)
  put($('s4now'), { x: 1010 + (1 - nowIn) * 120 - out * 100, y: 150 + Math.sin(t * 0.8) * 4, o: nowIn * (1 - out), b: (1 - nowIn) * 10 + out * 8 })
  $('s4art').style.transform = `rotate(${(t * 40).toFixed(2)}deg)`
  $('s4eq').querySelectorAll('div').forEach((b, i) => {
    const v = 0.22 + 0.78 * Math.abs(Math.sin(t * (3.1 + (i % 5) * 0.47) + i * 0.9) * Math.cos(t * 1.7 + i * 0.37))
    b.style.height = (v * 100).toFixed(1) + '%'
    b.style.opacity = (0.55 + v * 0.45).toFixed(3)
  })

  /* Three rows arrive; Meera's arrives late and is voted up past Rohan's. */
  const reorder = ep(t, 18.35, 19.15, E.inOutQuint)
  const slots = [0, lerp(1, 2, reorder), lerp(2, 1, reorder)]
  s4rows.forEach((r, i) => {
    const start = i < 2 ? 16.0 + i * 0.12 : 17.35
    const p = ep(t, start, start + 1.0)
    /* The rising row lifts toward the viewer as it passes; the one it
       overtakes sinks back and dims, so the swap reads as one card passing
       over another rather than two overlapping. */
    const arc = Math.sin(reorder * Math.PI)
    put(r, {
      x: (1 - p) * (i === 2 ? 220 : 80) + (i === 2 ? -arc * 18 : 0),
      y: slots[i] * 106 + (1 - p) * 20,
      s: 1 + (i === 2 ? arc * 0.045 : i === 1 ? -arc * 0.03 : 0),
      o: p * (i === 1 ? 1 - arc * 0.35 : 1),
    })
    r.style.boxShadow = i === 2 ? `0 ${(18 + arc * 30).toFixed(1)}px ${(40 + arc * 40).toFixed(1)}px -22px rgba(0,0,0,.95)` : ''
    r.style.zIndex = i === 2 ? 2 : 1
    const n = r.querySelector('.n')
    const votes = [2, 1, i === 2 ? (t > 18.25 ? 2 : 0) : 0]
    n.textContent = String(i === 2 ? (t > 18.25 ? 2 : 0) : [3, 1][i])
    r.querySelector('.votes').style.color = i === 2 && t > 18.25 ? '#ff5a5a' : ''
  })
  const plus = P(t, 18.15, 19.0)
  put(s4plus, { x: 690, y: 2 * 106 + 30 - E.outCubic(plus) * 60, o: plus > 0 ? Math.sin(plus * Math.PI) : 0, s: 0.8 + E.outBack(clamp(plus * 2)) * 0.3 })
  put($('s4queue'), { x: 1010 - out * 100, y: 488, o: 1 - out, b: out * 8 })
}

/* ── 5 · play ──────────────────────────────────────────────────────────── */
function scene5(t) {
  if (!show($('s5'), t, 20.3, 25.3)) return
  const L = 150
  enterExit($('s5eye'), t, 20.55, 24.55, { dy: 20, base: { x: L, y: 330 } })
  words($('s5h'), t, 20.7, 24.55)
  put($('s5h'), { x: L, y: 370 })

  const out = ep(t, 24.6, 25.25, E.inOutCubic)
  const bIn = ep(t, 20.85, 21.9)
  const bx = 990, by = 300
  put($('s5board-bg'), { x: bx - 30 + (1 - bIn) * 100 - out * 90, y: by - 30, o: bIn * (1 - out), s: 0.95 + bIn * 0.05, b: (1 - bIn) * 10 + out * 8 })
  put($('s5board'), { x: bx + (1 - bIn) * 100 - out * 90, y: by, o: bIn * (1 - out), s: 0.95 + bIn * 0.05, b: (1 - bIn) * 10 + out * 8 })
  ;['g1', 'g2', 'g3', 'g4'].forEach((id, i) => {
    const p = ep(t, 21.05 + i * 0.1, 21.75 + i * 0.1, E.inOutCubic)
    const n = $(id)
    n.style.strokeDasharray = '400'
    n.style.strokeDashoffset = ((1 - p) * 400).toFixed(1)
  })
  MOVES.forEach((m, i) => {
    const t0 = 21.75 + i * 0.3
    const p = ep(t, t0, t0 + 0.42, E.outCubic)
    const g = $('mv' + i)
    const shape = g.firstChild
    const len = m.k === 'x' ? 240 : 280
    shape.style.strokeDasharray = String(len)
    shape.style.strokeDashoffset = ((1 - p) * len).toFixed(1)
    g.style.opacity = p > 0 ? '1' : '0'
  })
  const win = ep(t, 23.35, 23.85, E.inOutCubic)
  const wl = $('win')
  wl.style.strokeDasharray = '481'
  wl.style.strokeDashoffset = ((1 - win) * 481).toFixed(1)
  wl.style.opacity = win > 0 ? '1' : '0'

  const lIn = ep(t, 21.5, 22.6)
  put($('s5lead'), { x: 1515 + (1 - lIn) * 120 - out * 120, y: 360 + Math.sin(t * 0.9) * 4, o: lIn * (1 - out), b: (1 - lIn) * 10 + out * 8 })
  $('s5lead').querySelectorAll('.lbar').forEach((b, i) => {
    const p = ep(t, 22.1 + i * 0.15, 23.4 + i * 0.15, E.outExpo)
    b.style.width = (p * (+b.dataset.v / 12) * 100).toFixed(2) + '%'
  })
  $('s5lead').querySelectorAll('.lscore').forEach((s, i) => {
    const p = ep(t, 22.1 + i * 0.15, 23.4 + i * 0.15, E.outExpo)
    s.textContent = String(Math.round(p * +s.dataset.v))
  })
}

/* ── 6 · study ─────────────────────────────────────────────────────────── */
function scene6(t) {
  if (!show($('s6'), t, 24.8, 31.1)) return
  const L = 150
  enterExit($('s6eye'), t, 25.05, 30.15, { dy: 20, base: { x: L, y: 330 } })
  words($('s6h'), t, 25.2, 30.15)
  put($('s6h'), { x: L, y: 370 })

  const out = ep(t, 30.2, 30.95, E.inOutCubic)
  const float = (k) => Math.sin(t * 0.8 + k) * 5

  const tIn = ep(t, 25.45, 26.6)
  put($('s6timer'), { x: 990 + (1 - tIn) * 80 - out * 100, y: 120 + float(0) + (1 - tIn) * 30, o: tIn * (1 - out), b: (1 - tIn) * 10 + out * 8 })
  const left = 1500 - Math.max(0, t - 25.6) * 1
  $('s6clock').textContent = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`
  $('s6ring').style.strokeDashoffset = (653.5 * (1 - left / 1500) * 1 + 653.5 * 0.18 * ep(t, 25.6, 30, E.inOutSine)).toFixed(2)

  const dIn = ep(t, 25.75, 26.9)
  put($('s6doc'), { x: 1370 + (1 - dIn) * 120 - out * 100, y: 140 + float(1) + (1 - dIn) * -40, r: (1 - dIn) * 4, o: dIn * (1 - out), b: (1 - dIn) * 10 + out * 8 })
  const scan = P(t, 26.7, 28.0)
  $('s6scan').style.transform = `translateX(${(E.inOutSine(scan) * 417).toFixed(1)}px)`
  $('s6scan').style.opacity = (scan > 0 && scan < 1 ? Math.sin(scan * Math.PI) : 0).toFixed(3)
  $('s6read').style.width = (E.inOutSine(scan) * 100).toFixed(2) + '%'

  const nIn = ep(t, 27.2, 28.3)
  put($('s6notes'), { x: 1320 + (1 - nIn) * 120 - out * 100, y: 330 + float(2) + (1 - nIn) * 30, o: nIn * (1 - out), b: (1 - nIn) * 10 + out * 8 })
  ;['n1', 'n2', 'n3'].forEach((id, i) => {
    const p = ep(t, 27.75 + i * 0.32, 28.35 + i * 0.32, E.outBack)
    const n = $(id)
    n.style.transformOrigin = 'center'
    n.style.transformBox = 'fill-box'
    n.style.transform = `scale(${(0.6 + 0.4 * p).toFixed(3)})`
    n.style.opacity = clamp(p).toFixed(3)
  })
  ;[['e1', 60, 28.0], ['e2', 60, 28.33], ['e3', 460, 28.75]].forEach(([id, len, t0]) => {
    const p = ep(t, t0, t0 + 0.55, E.inOutCubic)
    const e = $(id)
    e.style.strokeDasharray = String(len)
    e.style.strokeDashoffset = ((1 - p) * len).toFixed(1)
    e.style.opacity = p > 0.02 ? '1' : '0'
  })

  const cIn = ep(t, 26.4, 27.5)
  put($('s6code'), { x: 960 + (1 - cIn) * 120 - out * 100, y: 600 + float(3) + (1 - cIn) * 30, o: cIn * (1 - out), b: (1 - cIn) * 10 + out * 8 })
  $('s6lines').querySelectorAll('div').forEach((l, i) => {
    const p = ep(t, 26.9 + i * 0.22, 27.4 + i * 0.22, E.outCubic)
    l.style.opacity = p.toFixed(3)
    l.style.transform = `translateX(${((1 - p) * -16).toFixed(1)}px)`
    l.style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(1)}% 0 0)`
  })
  const pass = ep(t, 28.6, 29.2)
  $('s6pass').style.opacity = pass.toFixed(3)
  $('s6pass').style.transform = `translateY(${((1 - pass) * 10).toFixed(1)}px)`
  $('s6tick').style.strokeDashoffset = ((1 - ep(t, 28.8, 29.3, E.inOutCubic)) * 20).toFixed(1)
}

/* ── 7 · together ──────────────────────────────────────────────────────── */
function scene7(t) {
  if (!show($('s7'), t, 30.6, 35.4)) return
  words($('s7h'), t, 30.85, 34.6, 0.06)
  put($('s7h'), { x: 0, y: 110 })

  const out = ep(t, 34.6, 35.35, E.inOutCubic)
  put($('s7tiles'), { x: CX - 750, y: 430 })
  const speaker = t < 31.95 ? 0 : t < 32.75 ? 1 : t < 33.55 ? 3 : 2
  s7tiles.forEach((tile, i) => {
    const p = ep(t, 31.15 + i * 0.1, 32.25 + i * 0.1)
    /* On the way out they shrink into the corner, as the floating call does. */
    const fx = lerp(i * 385, 1500 - 230 + (i % 2) * -0, out)
    const fy = lerp(0, 330, out)
    put(tile, {
      x: i * 385 + (1 - p) * 30 + (fx - i * 385) * out,
      y: (1 - p) * 70 + Math.sin(t * 0.9 + i) * 4 + (fy) * out,
      s: (0.9 + p * 0.1) * (1 - out * 0.55),
      o: p * (1 - ep(t, 34.85, 35.35, E.inOutCubic)),
    })
    tile.style.transformOrigin = '50% 50%'
    const active = i === speaker && t > 31.6 && t < 34.4
    const ring = tile.querySelector('.ring')
    const was = parseFloat(ring.dataset.v || '0')
    ring.style.opacity = (active ? 0.65 + Math.sin(t * 9) * 0.35 : 0).toFixed(3)
    tile.querySelectorAll('.wave i').forEach((b, k) => {
      const h = active ? 25 + Math.abs(Math.sin(t * (9 + k * 2.3) + k)) * 75 : 22
      b.style.height = h.toFixed(1) + '%'
    })
  })

  put($('s7chat'), { x: CX - 750, y: 760 })
  const spots = [[60, 0], [520, 70], [1040, 0]]
  s7chat.forEach((b, i) => {
    const t0 = 31.95 + i * 0.8
    const p = ep(t, t0, t0 + 0.6, E.outBack)
    put(b, { x: spots[i][0], y: spots[i][1] + (1 - clamp(p)) * 30 - out * 30, s: 0.7 + 0.3 * p, o: clamp(p * 1.4) * (1 - out) })
    b.style.transformOrigin = '0% 50%'
  })
}

/* ── 8 · three steps, and the mark again ───────────────────────────────── */
function scene8(t) {
  if (!show($('s8'), t, 35.0, DURATION)) return
  put($('s8steps'), { x: CX - 790, y: 390 })
  const stepsOut = ep(t, 38.0, 38.7, E.inOutCubic)
  s8steps.forEach((s, i) => {
    const p = ep(t, 35.3 + i * 0.45, 36.4 + i * 0.45)
    put(s, { x: i * 540 + (1 - p) * 40, y: (1 - p) * 50 - stepsOut * 60, o: p * (1 - stepsOut), b: (1 - p) * 10 + stepsOut * 10 })
  })
  s8links.forEach((l, i) => {
    const p = ep(t, 35.75 + i * 0.45, 36.5 + i * 0.45, E.inOutCubic)
    l.style.left = (i * 540 + 100) + 'px'
    l.style.width = '400px'
    l.style.transform = `scaleX(${p.toFixed(4)})`
    l.style.opacity = (1 - stepsOut).toFixed(3)
  })

  /* The mark returns, and the film ends where the room begins. */
  const mIn = ep(t, 38.55, 39.55, E.outBack)
  const shift = ep(t, 39.15, 39.95, E.inOutQuint)
  const MARK = 150, GAP = 30
  const startX = CX - (MARK + GAP + $('s8word').offsetWidth) / 2
  put($('s8mark'), { x: lerp(CX - MARK / 2, startX, shift), y: CY - 150, s: 0.4 + mIn * 0.6, o: Math.min(1, mIn * 1.5), r: (1 - mIn) * -10 })
  put($('s8word'), { x: startX + MARK + GAP, y: CY - 158 })
  $('s8word').querySelectorAll('.w').forEach((c, i) => {
    const p = ep(t, 39.25 + i * 0.05, 40.15 + i * 0.05, E.outExpo)
    c.style.transform = `translate3d(${((1 - p) * -36).toFixed(2)}px,0,0)`
    c.style.opacity = p.toFixed(3)
    c.style.filter = p < 0.98 ? `blur(${((1 - p) * 10).toFixed(2)}px)` : 'none'
  })
  words($('s8tag'), t, 39.75, 99, 0.05)
  put($('s8tag'), { x: 0, y: CY + 52 })
  enterExit($('s8url'), t, 40.35, 99, { dy: 16, base: { y: CY + 160 } })
}

/* ═════════════════════════════════════════════════════════════════════════
   Entry points: the renderer calls window.render(t); ?t= previews a frame.
   ═════════════════════════════════════════════════════════════════════════ */
window.DURATION = DURATION
window.FPS = FPS
window.render = render
window.ready = document.fonts.ready.then(() => true)

const q = new URLSearchParams(location.search)
if (q.has('t')) ready.then(() => render(parseFloat(q.get('t'))))
else if (q.has('play')) ready.then(() => {
  const start = performance.now()
  const loop = () => { const t = ((performance.now() - start) / 1000) % DURATION; render(t); requestAnimationFrame(loop) }
  loop()
})
else render(0)
</script>
