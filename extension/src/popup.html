<!doctype html>
<meta charset="utf-8" />
<title>Huddle</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 320px; margin: 0; padding: 16px;
    background: #0c0c0e; color: #ececec;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  p.sub { margin: 0 0 14px; color: #8a8a8f; font-size: 11.5px; }
  label { display: block; margin-top: 10px; font-size: 11px; color: #a0a0a6; }
  input {
    width: 100%; margin-top: 4px; padding: 7px 9px; box-sizing: border-box;
    background: #161619; border: 1px solid #2a2a30; border-radius: 7px;
    color: #ececec; font: inherit; font-size: 12px;
  }
  input:focus { outline: none; border-color: #4a4a55; }
  button {
    width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 7px;
    background: #e5484d; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: #161619; font-size: 11.5px; }
  .bad { color: #ff9c9c; font-weight: 600; }
  .ok { color: #86e6a0; font-weight: 600; }
  .origin { margin-top: 12px; font-size: 10.5px; color: #7a7a80; word-break: break-all; }
  code { background: #1c1c21; padding: 1px 4px; border-radius: 4px; }
</style>

<h1>Huddle — Netflix</h1>
<p class="sub">Holds this tab to your room's clock.</p>

<label>Server URL<input id="server" placeholder="https://your-api.example" /></label>
<label>Room code<input id="code" placeholder="live-spsu" /></label>
<label>Session token<input id="token" type="password" placeholder="open the Huddle tab to fill this" /></label>

<button id="save">Connect</button>

<div class="status" id="status">Not connected.</div>

<div class="origin">
  Add this to the API's <code>CLIENT_ORIGIN</code> list:<br />
  <span id="origin"></span>
</div>

<script src="popup.js"></script>
